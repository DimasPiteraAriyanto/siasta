// ============ CLIENT-SIDE PAGE TEMPLATE CACHE (SPEED OPTIMIZATION) ============
var _pageHtmlCache = {};

// ============ MOBILE SIDEBAR CONTROLS ============
function toggleMobileSidebar() {
  var sidebar = document.getElementById('sidebar');
  var backdrop = document.getElementById('sidebar-backdrop');
  if (!sidebar) return;
  
  if (sidebar.classList.contains('open')) {
    closeMobileSidebar();
  } else {
    sidebar.classList.add('open');
    if (backdrop) backdrop.classList.add('active');
  }
}

function closeMobileSidebar() {
  var sidebar = document.getElementById('sidebar');
  var backdrop = document.getElementById('sidebar-backdrop');
  if (sidebar) sidebar.classList.remove('open');
  if (backdrop) backdrop.classList.remove('active');
}

// ============ TOP PROGRESS BAR (SPEED & FEEDBACK ANIMATION) ============
function startProgressBar() {
  var bar = document.getElementById('top-progress-bar');
  if (bar) {
    bar.style.opacity = '1';
    bar.style.width = '35%';
    bar.classList.add('active');
    setTimeout(function() {
      if (bar.style.width === '35%') bar.style.width = '75%';
    }, 200);
  }
}

function finishProgressBar() {
  var bar = document.getElementById('top-progress-bar');
  if (bar) {
    bar.style.width = '100%';
    setTimeout(function() {
      bar.style.opacity = '0';
      bar.classList.remove('active');
      setTimeout(function() {
        bar.style.width = '0%';
      }, 300);
    }, 250);
  }
}

// ============ SWEETALERT2 UTILITY HELPERS ============
function showSwalWarning(message, title) {
  if (typeof Swal !== 'undefined') {
    return Swal.fire({
      icon: 'warning',
      title: title || 'Peringatan',
      text: message,
      confirmButtonColor: '#1B2A4A',
      confirmButtonText: 'Mengerti'
    });
  } else {
    showToast(message, 'warning');
  }
}

function showSwalSuccess(message, title) {
  if (typeof Swal !== 'undefined') {
    return Swal.fire({
      icon: 'success',
      title: title || 'Berhasil',
      text: message,
      confirmButtonColor: '#1B2A4A',
      timer: 2500,
      showConfirmButton: true
    });
  } else {
    showToast(message, 'success');
  }
}

function showSwalError(message, title) {
  if (typeof Swal !== 'undefined') {
    return Swal.fire({
      icon: 'error',
      title: title || 'Terjadi Kesalahan',
      text: message,
      confirmButtonColor: '#E74C3C',
      confirmButtonText: 'Tutup'
    });
  } else {
    showToast(message, 'error');
  }
}

function showSwalConfirm(title, text, confirmText, cancelText) {
  if (typeof Swal !== 'undefined') {
    return Swal.fire({
      title: title || 'Konfirmasi',
      text: text,
      icon: 'question',
      showCancelButton: true,
      confirmButtonColor: '#1B2A4A',
      cancelButtonColor: '#64748B',
      confirmButtonText: confirmText || 'Ya, Lanjutkan',
      cancelButtonText: cancelText || 'Batal',
      reverseButtons: true
    }).then(function(result) {
      return result.isConfirmed;
    });
  } else {
    return Promise.resolve(confirm(text));
  }
}

function showProcessLoading(title, text) {
  if (typeof Swal !== 'undefined') {
    Swal.fire({
      title: title || 'Sedang Memproses...',
      text: text || 'Mohon tunggu sebentar...',
      allowOutsideClick: false,
      allowEscapeKey: false,
      showConfirmButton: false,
      didOpen: function() {
        Swal.showLoading();
      }
    });
  } else {
    showLoading();
  }
}

function hideProcessLoading() {
  if (typeof Swal !== 'undefined') {
    Swal.close();
  } else {
    hideLoading();
  }
}

// ============ NAVIGATION (INSTANT CACHED & ANIMATED) ============
function setPageContent(html) {
  var container = document.getElementById('page-content');
  if (!container) return;
  
  // Gunakan jQuery jika tersedia agar seluruh tag <script> dieksekusi secara global
  if (typeof jQuery !== 'undefined') {
    jQuery(container).html(html);
  } else {
    container.innerHTML = html;
    var scripts = container.querySelectorAll('script');
    scripts.forEach(function(oldScript) {
      var newScript = document.createElement('script');
      Array.from(oldScript.attributes).forEach(function(attr) {
        newScript.setAttribute(attr.name, attr.value);
      });
      newScript.appendChild(document.createTextNode(oldScript.innerHTML));
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  }
}

function navigateTo(page, param) {
  closeMobileSidebar();
  startProgressBar();
  showLoading();

  // Jika membuka detail arsip tapi param tidak diberikan, coba ambil dari window atau sessionStorage
  if (page === 'detail-arsip' && !param) {
    param = window._arsipDetailId;
    if (!param) {
      try {
        param = sessionStorage.getItem('siasta_detail_id');
      } catch(e) {}
    }
  }

  google.script.run
    .withSuccessHandler(function(html) {
      setPageContent(html);
      setActivePage(page);
      hideLoading();
      finishProgressBar();
      
      // Inisialisasi Select2 pada elemen yang baru dimuat
      setTimeout(function() {
        initSelect2('.select2');
      }, 50);
    })
    .withFailureHandler(function(err) {
      hideLoading();
      finishProgressBar();
      showSwalError('Gagal memuat halaman: ' + err.message, 'Gagal Memuat');
    })
    .getPageContent(page, param);
}

// Global Handler: Switch Tab Pengaturan Sistem
window.switchPengaturanTab = function(tabKey) {
  var tabs = ['profil', 'template', 'ttd', 'asal', 'tools'];
  tabs.forEach(function(t) {
    var pane = document.getElementById('tab-pane-' + t);
    var btn = document.getElementById('tab-btn-' + t);
    if (pane) pane.style.display = (t === tabKey) ? 'block' : 'none';
    if (btn) {
      if (t === tabKey) {
        btn.classList.add('active');
        btn.style.color = 'var(--primary)';
        btn.style.fontWeight = '700';
        btn.style.borderBottom = '3px solid var(--primary)';
      } else {
        btn.classList.remove('active');
        btn.style.color = 'var(--text-muted)';
        btn.style.fontWeight = '600';
        btn.style.borderBottom = '3px solid transparent';
      }
    }
  });
};

// ============ SELECT2 HELPER & GLOBAL SAFETY ============
if (typeof jQuery !== 'undefined' && jQuery.fn.select2) {
  try {
    jQuery.fn.select2.defaults.set('dropdownAutoWidth', false);
  } catch (e) {}

  // Global guard: prevent any horizontal window/container scroll when Select2 dropdown opens
  jQuery(document).off('select2:open.safeguard').on('select2:open.safeguard', function() {
    if (window.scrollX !== 0) {
      window.scrollTo(0, window.scrollY);
    }
    document.documentElement.scrollLeft = 0;
    document.body.scrollLeft = 0;
    var mc = document.querySelector('.main-content');
    if (mc) mc.scrollLeft = 0;
    var ca = document.querySelector('.content-area');
    if (ca) ca.scrollLeft = 0;
  });
}

function initSelect2(selector, customOptions) {
  if (typeof jQuery === 'undefined' || !jQuery.fn.select2) return;
  
  var targets = selector ? jQuery(selector).filter('select') : jQuery('select.select2');
  targets.each(function() {
    var $el = jQuery(this);
    if ($el.hasClass('select2-hidden-accessible')) {
      if (customOptions && customOptions.forceReinit) {
        $el.select2('destroy');
      } else {
        return; // Sudah aktif, hindari destroy dan trigger event change berulang
      }
    }
    
    var isToolbar = $el.closest('.toolbar').length > 0;
    var defaultOpts = {
      width: isToolbar ? 'resolve' : '100%',
      dropdownAutoWidth: false
    };
    
    // Cek apakah elemen berada di dalam toolbar atau opsi pertamanya diawali dengan "Semua"
    var firstOpt = $el.find('option').first().text().trim();
    var isFilterAll = isToolbar || (firstOpt && (firstOpt.indexOf('Semua') === 0 || firstOpt.indexOf('All') === 0));
    
    if (!isFilterAll) {
      var ph = $el.data('placeholder') || $el.attr('placeholder') || '— Pilih Salah Satu —';
      defaultOpts.placeholder = ph;
    }
    
    var modalOverlay = $el.closest('.modal-overlay');
    if (modalOverlay.length > 0) {
      defaultOpts.dropdownParent = modalOverlay;
    }
    
    $el.select2(jQuery.extend({}, defaultOpts, customOptions || {}));
  });
}

// ============ TOAST NOTIFICATION ============
function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }
  
  var icons = {
    success: '✓',
    error: '✕',
    warning: '⚠',
    info: 'ℹ'
  };
  
  var toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.innerHTML = '<span style="font-size:16px;font-weight:700;">' + (icons[type] || '') + '</span><span>' + message + '</span>';
  container.appendChild(toast);
  
  setTimeout(function() {
    toast.style.animation = 'slideOut 0.3s ease forwards';
    setTimeout(function() { toast.remove(); }, 300);
  }, 4000);
}

function showLoading() {
  var el = document.getElementById('loading-overlay');
  if (el) el.style.display = 'flex';
}

function hideLoading() {
  var el = document.getElementById('loading-overlay');
  if (el) el.style.display = 'none';
}

// ============ MODAL ============
function openModal(modalId) {
  var modal = document.getElementById(modalId);
  if (modal) {
    modal.style.display = 'flex';
    requestAnimationFrame(function() {
      modal.classList.add('active');
    });

}

function closeModal(modalId) {

  if (modal) {
    modal.classList.remove('active');

// ============ AUTH ============
function doLogin() {
  var usernameInput = document.getElementById('login-username');
  var passwordInput = document.getElementById('login-password');
  var staffSelect = document.getElementById('staff-select');
  
  var username = usernameInput ? usernameInput.value.trim() : 'siasta';
  var password = passwordInput ? passwordInput.value : 'admin';
  var staffId = staffSelect ? staffSelect.value : '';
  
  if (!username) {
    showToast('Silakan masukkan username.', 'warning');
    if (usernameInput) usernameInput.focus();
    return;
  }
  if (!password) {
    showToast('Silakan masukkan password.', 'warning');
    if (passwordInput) passwordInput.focus();
    return;
  }
  if (!staffId) {
    showToast('Silakan pilih profil staf Anda terlebih dahulu.', 'warning');
    if (staffSelect) staffSelect.focus();
    return;
  }
  
  var btn = document.getElementById('btn-login');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="loading-spinner" style="width:18px;height:18px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:6px;"></span> Memproses...';
  }
  
  google.script.run
    .withSuccessHandler(function(response) {
      if (response.success) {
        showToast('Selamat datang, ' + response.data.nama + '!', 'success');
        try {
          if (response.data) {
            sessionStorage.setItem('siasta_user', JSON.stringify(response.data));
          }
        } catch (e) {}
        setTimeout(function() { 
          try {
            window.location.reload();
          } catch (e2) {
            google.script.run
              .withSuccessHandler(function(url) {
                window.location.href = url;
              })
              .getAppUrl();
          }
        }, 1000);
      } else {
        showToast(response.message, 'error');
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '🚀 Masuk ke SIASTA';
        }
      }
    })
    .withFailureHandler(function(err) {
      showToast('Error: ' + err.message, 'error');
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '🚀 Masuk ke SIASTA';
      }
    })
    .login(username, password, staffId);
}

function doLogout() {
  if (typeof Swal !== 'undefined') {
    Swal.fire({
      title: 'Konfirmasi Keluar',
      text: 'Apakah Anda yakin ingin keluar dari sesi pengguna SIASTA ini?',
      icon: 'question',
      showCancelButton: true,
      confirmButtonColor: '#1B2A4A',
      cancelButtonColor: '#64748B',
      confirmButtonText: 'Ya, Keluar',
      cancelButtonText: 'Batal',
      reverseButtons: true
    }).then(function(result) {
      if (result.isConfirmed) {
        showProcessLoading('Sedang Keluar...', 'Menghapus sesi autentikasi...');
        google.script.run
          .withSuccessHandler(function() {
            hideProcessLoading();
            transitionToAuth();
          })
          .withFailureHandler(function(err) {
            hideProcessLoading();
            showSwalError('Gagal keluar: ' + err.message, 'Gagal Logout');
          })
          .logout();
      }
    });
  } else {
    if (confirm('Yakin ingin keluar?')) {
      showLoading();
      google.script.run
        .withSuccessHandler(function() {
          hideLoading();
          transitionToAuth();
        })
        .withFailureHandler(function(err) {
          hideLoading();
          showToast('Logout gagal: ' + err.message, 'error');
        })
        .logout();
    }
  }
}

function transitionToAuth() {
  try { sessionStorage.removeItem('siasta_user'); } catch (e) {}
  window._currentUser = null;
  
  var appView = document.getElementById('main-app-container');
  var authView = document.getElementById('auth-view');
  
  if (appView) {
    appView.style.display = 'none';
    appView.classList.add('hidden');
  }
  
  var passInput = document.getElementById('input-password');
  if (passInput) passInput.value = '';
  
  var btnLogin = document.getElementById('btn-login-submit');
  if (btnLogin) {
    btnLogin.disabled = false;
    btnLogin.innerHTML = '🚀 Masuk ke Dashboard SIASTA';
  }
  
  if (authView) {
    authView.style.display = 'flex';
    requestAnimationFrame(function() {
      authView.classList.remove('hidden');
      var userInput = document.getElementById('input-username');
      if (userInput) userInput.focus();
    });
  }
  
  if (typeof Swal !== 'undefined') {
    Swal.fire({
      icon: 'info',

      text: 'Anda telah berhasil keluar dari sistem SIASTA.',
      confirmButtonColor: '#1B2A4A',
      timer: 2000,
      showConfirmButton: false
    });
  } else {
    showToast('Anda telah berhasil keluar dari sistem.', 'info');
  }
}

function getActiveUserFromSession() {
  if (window._currentUser) return window._currentUser;
  try {
    var raw = sessionStorage.getItem('siasta_user');
    if (raw) {
      window._currentUser = JSON.parse(raw);
      return window._currentUser;
    }
  } catch (e) {}
  return null;
}

// ============ FILE UPLOAD HELPER ============
function handleFileUpload(inputId, previewId) {
  var input = document.getElementById(inputId);
  var file = input.files[0];
  
  if (!file) return;
  
  // Validate size (max 10MB)
  if (file.size > 10 * 1024 * 1024) {
    showToast('Ukuran file maksimal 10MB.', 'error');
    input.value = '';
    return;
  }
  
  var preview = document.getElementById(previewId);
  if (preview) {
    var sizeText = (file.size / 1024 / 1024).toFixed(2) + ' MB';
    preview.innerHTML = '<div class="file-preview">' +
      '<span class="file-icon">📄</span>' +
      '<span class="file-name">' + file.name + '</span>' +
      '<span class="file-size">' + sizeText + '</span>' +
      '<button class="btn btn-sm btn-outline" onclick="clearFile(\'' + inputId + '\', \'' + previewId + '\')">✕</button>' +
      '</div>';
  }
}

function clearFile(inputId, previewId) {
  document.getElementById(inputId).value = '';
  document.getElementById(previewId).innerHTML = '';
}

function readFileAsBase64(inputId, callback) {
  var input = document.getElementById(inputId);
  var file = input.files[0];
  
  if (!file) {
    callback(null);
    return;
  }
  
  var reader = new FileReader();
  reader.onload = function(e) {
    var base64 = e.target.result.split(',')[1];
    callback({
      data: base64,
      name: file.name,
      type: file.type,
      size: file.size
    });
  };
  reader.readAsDataURL(file);
}

// ============ FORMAT & ESCAPE HELPERS ============
function formatNumber(num) {
  if (!num) return '0';
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function padNumber(num, length) {
  if (num === null || num === undefined) return '00';
  var s = num.toString();
  length = length || 2;
  while (s.length < length) {
    s = '0' + s;
  }
  return s;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function formatTanggal(date, format) {
  if (!date) return '-';
  if (typeof date === 'string') date = new Date(date);
  if (!(date instanceof Date) || isNaN(date.getTime())) return '-';
  
  var bulan = [
    'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
    'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
  ];
  var hari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  
  var d = date.getDate();
  var m = date.getMonth();
  var y = date.getFullYear();
  var h = padNumber(date.getHours(), 2);
  var min = padNumber(date.getMinutes(), 2);
  
  if (format === 'short') return d + '/' + padNumber(m + 1, 2) + '/' + y;
  if (format === 'datetime') return d + ' ' + bulan[m] + ' ' + y + ' ' + h + ':' + min;
  if (format === 'day') return hari[date.getDay()] + ', ' + d + ' ' + bulan[m] + ' ' + y;
  return d + ' ' + bulan[m] + ' ' + y;
}

function formatDateIndo(date, withTime) {
  if (!date) return '-';
  if (typeof date === 'string') date = new Date(date);
  if (!(date instanceof Date) || isNaN(date.getTime())) return '-';
  
  var res = formatTanggal(date, 'long');
  if (withTime) {
    res += ' ' + padNumber(date.getHours(), 2) + ':' + padNumber(date.getMinutes(), 2) + ':' + padNumber(date.getSeconds(), 2) + ' WITA';
  }
  return res;
}

// ============ DRAG & DROP ============
function initDragDrop(areaId, inputId) {
  var area = document.getElementById(areaId);
  if (!area) return;
  
  area.addEventListener('dragover', function(e) {
    e.preventDefault();
    area.classList.add('dragover');
  });
  
  area.addEventListener('dragleave', function() {
    area.classList.remove('dragover');
  });
  
  area.addEventListener('drop', function(e) {
    e.preventDefault();
    area.classList.remove('dragover');
    var input = document.getElementById(inputId);
    if (e.dataTransfer.files.length > 0) {
      input.files = e.dataTransfer.files;
      handleFileUpload(inputId, inputId + '-preview');
    }
  });
  
  area.addEventListener('click', function() {
    document.getElementById(inputId).click();
  });
}

// ============ UNIVERSAL PRINT ENGINE (SIASTA PRINT) ============
function siastaPrint(target, options) {
  options = options || {};
  var el = typeof target === 'string' ? document.getElementById(target) : target;
  if (!el) {
    if (typeof showSwalError === 'function') {
      showSwalError('Elemen yang akan dicetak tidak ditemukan.');
    } else {
      alert('Elemen yang akan dicetak tidak ditemukan.');
    }
    return;
  }

  // 1. Bersihkan stage print lama jika ada
  var oldSection = document.getElementById('siasta-print-section');
  if (oldSection) oldSection.remove();
  var oldStyle = document.getElementById('siasta-dynamic-print-style');
  if (oldStyle) oldStyle.remove();

  // 2. Setup orientasi dan margin A4
  var orientation = options.orientation === 'landscape' ? 'landscape' : 'portrait';
  var margin = options.margin || (orientation === 'landscape' ? '12mm 10mm' : '15mm 18mm');

  var styleTag = document.createElement('style');
  styleTag.id = 'siasta-dynamic-print-style';
  styleTag.textContent = '@media print { @page { size: A4 ' + orientation + '; margin: ' + margin + '; } }';
  document.head.appendChild(styleTag);

  // 3. Buat wrapper khusus cetak langsung di root body
  var printSection = document.createElement('div');
  printSection.id = 'siasta-print-section';
  printSection.className = 'siasta-print-section ' + (options.className || '');
  printSection.innerHTML = el.innerHTML;
  document.body.appendChild(printSection);

  // 4. Aktifkan kelas print mode pada body
  document.body.classList.add('siasta-is-printing');

  // 5. Panggil window.print()
  setTimeout(function() {
    window.print();
    // 6. Cleanup setelah dialog print selesai / dibatalkan
    setTimeout(function() {
      document.body.classList.remove('siasta-is-printing');
      var ps = document.getElementById('siasta-print-section');
      if (ps) ps.remove();
      var st = document.getElementById('siasta-dynamic-print-style');
      if (st) st.remove();
    }, 1000);
  }, 150);
}

function printElement(elementId, options) {
  options = options || {};
  siastaPrint(elementId, options);
}

// ============ CONFIRM DIALOG ============
function confirmAction(message, callback) {
  if (typeof Swal !== 'undefined') {
    Swal.fire({
      title: 'Konfirmasi Tindakan',
      text: message,
      icon: 'question',
      showCancelButton: true,
      confirmButtonColor: '#1B2A4A',
      cancelButtonColor: '#64748B',
      confirmButtonText: 'Ya, Lanjutkan',
      cancelButtonText: 'Batal',
      reverseButtons: true
    }).then(function(result) {
      if (result.isConfirmed && typeof callback === 'function') {
        callback();
      }
    });
  } else {
    if (confirm(message)) {
      callback();
    }
  }
}

// ============ DEBOUNCE ============
function debounce(func, wait) {
  var timeout;
  return function() {
    var context = this, args = arguments;
    clearTimeout(timeout);
    timeout = setTimeout(function() {
      func.apply(context, args);
    }, wait);
  };
}
