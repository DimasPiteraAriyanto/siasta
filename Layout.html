  <script>
    // Enforce authentication & session lifecycle on startup
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof initSessionOnPageLoad === 'function') {
        initSessionOnPageLoad();
      } else {
        var user = (typeof getActiveUserFromSession === 'function') ? getActiveUserFromSession() : null;
        if (user) {
          navigateTo('dashboard');
        } else {
          var appView = document.getElementById('main-app-container');
          var authView = document.getElementById('auth-view');
          if (appView) appView.style.display = 'none';
          if (authView) authView.style.display = 'flex';
        }
      }
    });
  </script>
